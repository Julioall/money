<div class="container-lg bg-neutral-white-100 rounded-4 p-3 p-sm-5">
  <div class="row">
    <h1 class="col-10 col-sm-6 col-md-9 text-medium fw-bold ">Categories</h1>
    <button type="button" data-bs-toggle="modal" data-bs-target="#incomeModal" *ngIf="isIncomeCategory"
      class="btn col rounded-2 bg-green-light text-green-primary d-flex justify-content-center justify-content-sm-between align-items-center text-small"><i
        class="fa fa-plus-circle text-green-primary-darker text-medium" aria-hidden="true"></i><span
        class="ms-3 d-none d-sm-block">Income Category</span></button>
    <button *ngIf="isExpenseCategory" type="button" data-bs-toggle="modal" data-bs-target="#expenseModal"
      class="btn col rounded-2 bg-green-light text-green-primary d-flex justify-content-center justify-content-sm-between align-items-center text-small"><i
        class="fa fa-plus-circle text-green-primary-darker text-medium" aria-hidden="true"></i><span
        class="ms-3 d-none d-sm-block">Expense Category</span></button>
  </div>
  <div class="row mt-5">
    <div class="col mt-5">
      <div class="row">
        <a (click)="toggleCategory()" [ngClass]="{'active-income  border-opacity-75': isIncomeCategory}"
          class="col text-center text-small text-green-primary pb-2">Income</a>
        <a (click)="toggleCategory()" [ngClass]="{'active-expense border-opacity-75': isExpenseCategory}"
          class="col text-center text-small text-red-primary pb-2">Expense</a>
        <div class="border-bottom border-1  border-opacity-75">
        </div>
        <div class="row mt-5">
          <div class="col-12" *ngIf="isIncomeCategory">
            <ul class="p-0">
              <li *ngFor="let item of incomeCategories">
                <div class="card d-flex justify-content-between bg-neutral-white-100 border-0 p-1"
                  id="category-{{item.id}}">
                  <div class="card-body d-flex align-items-center justify-content-between">
                    <span class="d-flex align-items-center"><i
                        [ngClass]="[item.classIcon || 'fa-solid fa-file', item.classBackground || 'bg-gray-dark']"
                        class="d-flex align-items-center justify-content-center text-small me-3 text-neutral-white-100  rounded-5"></i>
                      {{ item.name }}</span>
                    <div>
                      <button (click)="onEdit(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-pencil d-flex align-items-center justify-content-center text-x-small me-3 text-yellow-primary bg-yellow-light  rounded-5"></i>
                      </button>
                      <button (click)="onRemove(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-x d-flex align-items-center justify-content-center text-x-small text-red-primary bg-red-light  rounded-5"></i>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="border-bottom border-1  border-opacity-75 bg-opacity-50 border-gray"></div>
              </li>
            </ul>
          </div>
          <div class="col-12" *ngIf="isExpenseCategory">
            <ul class="p-0">
              <li *ngFor="let item of expenseCategories">
                <div class="card d-flex justify-content-between bg-neutral-white-100 border-0 p-1"
                  id="category-{{item.id}}">
                  <div class="card-body d-flex align-items-center justify-content-between">
                    <span class="d-flex align-items-center"><i
                        [ngClass]="[item.classIcon || 'fa-solid fa-file', item.classBackground || 'bg-gray-dark']"
                        class="d-flex align-items-center justify-content-center text-small me-3 text-neutral-white-100  rounded-5"></i>
                      {{ item.name }}</span>
                    <div>
                      <button (click)="onEdit(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-pencil d-flex align-items-center justify-content-center text-x-small me-3 text-yellow-primary bg-yellow-light  rounded-5"></i>
                      </button>
                      <button (click)="onRemove(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-x d-flex align-items-center justify-content-center text-x-small text-red-primary bg-red-light  rounded-5"></i>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="border-bottom border-1  border-opacity-75 bg-opacity-50 border-gray"></div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <app-modal [idModal]="'incomeModal'" [title]="'Título Personalizado'" (action)="onAddIncome()"
      [textButton]="'Create Income'">
      <p class="text-gray-dark text-small mb-5">Creating income category</p>
      <div class="d-flex align-items-center justify-content-start border-bottom border-1 border-opacity-75 mb-4 pb-4">
        <div class="iconSelected me-3" [ngStyle]="{'background-color': '#'+selectedColorIncome}"></div>
        <div class="category-name col">
          <label for="nameCategory text-gray-light">Category name</label>
          <input class="mt-0" id="nameCategory" type="text">
        </div>
      </div>
      <div class="circle-container d-flex align-items-center justify-content-start border-bottom border-1 border-opacity-75 mb-4 pb-4">
        <p class="text-gray-dark text-small mb-5">Choose a color</p>
        <app-color-picker [colors]="customizedColors" (colorSelected)="onColorSelectedIncome($event)"></app-color-picker>
      </div>
    </app-modal>
    <app-modal [idModal]="'expenseModal'" [title]="'Título Personalizado'" (action)="onAddIncome()"
      [textButton]="'Create Expense'">
      <p class="text-gray-dark text-small mb-5">Creating expense category</p>
      <div class="d-flex align-items-center justify-content-start border-bottom border-1 border-opacity-75 mb-4 pb-4">
        <div class="iconSelected me-3" [ngStyle]="{'background-color': '#'+selectedColorExpense}"></div>
        <div class="category-name col">
          <label for="nameCategory text-gray-light">Category name</label>
          <input class="mt-0" id="nameCategory" type="text">
        </div>
      </div>
      <div class="circle-container d-flex align-items-center justify-content-start border-bottom border-1 border-opacity-75 mb-4 pb-4">
        <p class="text-gray-dark text-small mb-5">Choose a color</p>
        <app-color-picker [colors]="customizedColors" (colorSelected)="onColorSelectedExpense($event)"></app-color-picker>
      </div>
    </app-modal>
  </div>
</div>
