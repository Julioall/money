<div class="container-lg bg-neutral-white-100 rounded-4 p-3 p-sm-5">
  <div class="row">
    <h1 class="col-10 col-sm-6 col-md-9 text-medium fw-bold">{{ 'components.accounts.title' | translate }}</h1>
    <button type="button" data-bs-toggle="modal" data-bs-target="#newAccountModal"
      class="btn col rounded-2 bg-green-light text-green-primary d-flex justify-content-center justify-content-sm-between align-items-center text-small">
      <i class="fa fa-plus-circle text-green-primary-darker text-medium"></i>
      <span class="ms-3 d-none d-sm-block">{{ 'components.accounts.textButtonNewAccount' | translate }}</span>
    </button>
  </div>
  <div class="row mt-5">
    <div class="col mt-5">
      <ul class="p-0">
        <li *ngFor="let item of accounts; let i = index">
          <div class="card d-flex justify-content-between bg-neutral-white-100 border-0 p-1" id="account-{{i}}">
            <div class="card-body d-flex align-items-center justify-content-between">
              <span class="d-flex align-items-center">
                <img
                  [src]="item.iconUrl"
                  class="account-img d-flex justify-content-center align-items-center me-3 text-neutral-white-100 text-small rounded-5">
                <span class="ms-3 text-small">{{ item.accountName }}</span>
              </span>
            </div>
          </div>
          <div class="border-bottom border-1 border-opacity-75 bg-opacity-75 border-gray"></div>
        </li>
      </ul>
    </div>
  </div>

  <form [formGroup]="accountForm">
    <app-modal [idModal]='idAccountModal' [textButton]="textButtonActionAccountModal" (action)="onActionModal()" (close)="onResetSelections()">
      <p class="text-small text-gray-dark fw-medium mb-5 d-flex justify-content-start">{{ 'components.accounts.creatingAccounts' | translate }}</p>
    </app-modal>
  </form>
</div>
