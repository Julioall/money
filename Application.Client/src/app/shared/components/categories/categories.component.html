<div class="container-lg bg-neutral-white-100 rounded-4 p-5">
  <div class="row">
    <h1 class="col-9 text-medium fw-bold ">Categories</h1>
    <button (click)="onAddIncome()" *ngIf="isIncomeCategory"
      class="btn col rounded-2 bg-green-light text-green-primary d-flex justify-content-between align-items-center"><i
        class="fa fa-plus-circle text-green-primary-darker text-small" aria-hidden="true"></i>Income Category</button>
    <button (click)="onAddExpense()" *ngIf="isExpenseCategory"
      class="btn col rounded-2 bg-green-light text-green-primary d-flex justify-content-between align-items-center"><i
        class="fa fa-plus-circle text-green-primary-darker text-small" aria-hidden="true"></i>Expense Category</button>
  </div>
  <div class="row mt-5">
    <div class="col mt-5">
      <div class="row">
        <a (click)="toggleCategory()" [ngClass]="{'ative-income  border-opacity-75': isIncomeCategory}"
          class="col text-center text-small text-green-primary pb-2">Income</a>
        <a (click)="toggleCategory()" [ngClass]="{'ative-expense border-opacity-75': isExpenseCategory}"
          class="col text-center text-small text-red-primary pb-2">Expense</a>
        <div class="border-bottom border-1  border-opacity-75">
        </div>
        <div class="row">
          <div class="col-12" *ngIf="isIncomeCategory">
            <ul>
              <li *ngFor="let item of incomeCategories" class="p-1">
                <div class="card d-flex justify-content-between bg-neutral-white-100" id="category-{{item.id}}">
                  <div class="card-body d-flex align-items-center justify-content-between">
                    <span class="d-flex align-items-center"><i
                        [ngClass]="[item.classIcon || 'fa-solid fa-file', item.classBackground || 'bg-gray-dark']"
                        class="d-flex align-items-center justify-content-center text-medium me-3 text-neutral-white-100  rounded-5"></i>
                      {{ item.name }}</span>
                    <div>
                      <button (click)="onEdit(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-pencil d-flex align-items-center justify-content-center text-x-small me-3 text-yellow-primary bg-yellow-light  rounded-5"></i>
                      </button>
                      <button (click)="onRemove(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-x d-flex align-items-center justify-content-center text-x-small text-red-primary bg-red-light  rounded-5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </li>
            </ul>
          </div>
          <div class="col-12" *ngIf="isExpenseCategory">
            <ul>
              <li *ngFor="let item of expenseCategories" class="p-1">
                <div class="card d-flex justify-content-between bg-neutral-white-100" id="category-{{item.id}}">
                  <div class="card-body d-flex align-items-center justify-content-between">
                    <span class="d-flex align-items-center"><i
                        [ngClass]="[item.classIcon || 'fa-solid fa-file', item.classBackground || 'bg-gray-dark']"
                        class="d-flex align-items-center justify-content-center text-medium me-3 text-neutral-white-100  rounded-5"></i>
                      {{ item.name }}</span>
                    <div>
                      <button (click)="onEdit(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-pencil d-flex align-items-center justify-content-center text-x-small me-3 text-yellow-primary bg-yellow-light  rounded-5"></i>
                      </button>
                      <button (click)="onRemove(item)" class="bg-transparent">
                        <i
                          class="fa-solid fa-x d-flex align-items-center justify-content-center text-x-small text-red-primary bg-red-light  rounded-5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

  </div>
