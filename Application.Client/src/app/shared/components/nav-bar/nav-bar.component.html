<header *ngIf="isLoggedIn" class="border-bottom lh-1 py-2 fw-bold">
  <div class="container">
    <div class="row">
      <div class="col d-flex align-items-center justify-content-start">
        <a class="navbar-brand d-flex justify-content-start align-items-center"><i
            class="fa-solid fa-wallet me-2"></i>Money</a>
      </div>
      <div class="col-6 d-flex align-items-center justify-content-center">
        <nav class="nav justify-content-between">
            <a class="nav-item nav-link" aria-label="Go to overview">Overview</a>
            <a class="nav-item nav-link" aria-label="Go to launch">Launch</a>
            <a class="nav-item nav-link" aria-label="Go to reports">Reports</a>
            <a class="nav-item nav-link" aria-label="Go to spending limit">Spending Limit</a>
        </nav>
      </div>
      <div class="col d-flex align-items-center justify-content-end">
        <div class="dropdown me-4">
          <a type="button" class="me-2d-block text-decoration-none dropdown-toggle" id="dropdownSettings"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-gear"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="dropdownSettings">
            <li><a class="dropdown-item">Categories</a></li>
            <li><a class="dropdown-item">Accounts</a></li>
            <li><a class="dropdown-item">Credit Cards</a></li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li><a class="dropdown-item text-muted">Preferences</a></li>
            <li><a class="dropdown-item text-muted">My Plan</a></li>
            <li><a class="dropdown-item text-muted">Tags</a></li>
            <li><a class="dropdown-item text-muted">Alerts</a></li>
            <li><a class="dropdown-item text-muted">Activities</a></li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li><a class="dropdown-item text-muted ">more options</a></li>
          </ul>
        </div>
        <div class="dropdown me-4">
          <a type="button" class="me-2d-block text-decoration-none dropdown-toggle"
            id="dropdownNotification" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-bell"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="dropdownNotification">
            <li><a class="dropdown-item">Profile</a></li>
            <li><a class="dropdown-item">Settings</a></li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li><a class="dropdown-item">Sign out</a></li>
          </ul>
        </div>
        <div class="dropdown">
          <a class="d-block text-decoration-none dropdown-toggle" id="dropdownProfile"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-user"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="dropdownProfile">
            <li><a class="dropdown-item text-center fs-1"><i id="profile-icon" class="fas fa-user-circle"></i></a>
            </li>
            <li><a class="dropdown-item text-center">My Account</a></li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li><a class="dropdown-item text-center" (click)="onClickLogout()">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>
