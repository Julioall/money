<header *ngIf="isLoggedIn" class="border-bottom lh-1 py-3">
  <div class="container">
    <div class="row">
      <div class="col d-flex align-items-center justify-content-start">
        <a class="navbar-brand d-flex justify-content-start align-items-center fw-bold text-medium"><i
            class="fa-solid fa-wallet me-2"></i>Money</a>
      </div>
      <div class="col-6 d-flex align-items-center justify-content-center">
        <nav class="nav justify-content-between">
            <a class="nav-item nav-link text-small text-green-light" aria-label="Go to overview">Overview</a>
            <a class="nav-item nav-link text-small text-green-light" aria-label="Go to reports">Reports</a>
            <a class="nav-item nav-link text-small text-green-light" aria-label="Go to spending limit">Spending Limit</a>
            <a class="nav-item nav-link text-small text-green-light" aria-label="Go to launch">Launch</a>
        </nav>
      </div>
      <div class="col d-flex align-items-center justify-content-end">
        <div class="dropdown me-4">
          <a type="button" class="me-2d-block text-decoration-none dropdown-toggle" id="dropdownSettings"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-gear text-small"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end settings-adm " aria-labelledby="dropdownSettings">
            <li><a class="dropdown-item text-muted" routerLink="/settings/categories">Categories</a></li>
            <li><a class="dropdown-item text-muted" routerLink="/settings/accounts">Accounts</a></li>
            <li><a class="dropdown-item text-muted" routerLink="/settings/cards">Credit Cards</a></li>
            <li>
              <div class="border-bottom border-1  border-opacity-75"></div>
            </li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">Preferences</a></li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">My Plan</a></li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">Tags</a></li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">Alerts</a></li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">Activities</a></li>
            <li>
              <div class="border-bottom border-1  border-opacity-75"></div>
            </li>
            <li><a class="dropdown-item text-muted text-x-small" routerLink="/">more options</a></li>
          </ul>
        </div>
        <div class="dropdown me-4">
          <a type="button" class="me-2d-block text-decoration-none dropdown-toggle"
            id="dropdownNotification" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-bell text-small"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="dropdownNotification">
            <li><a class="dropdown-item"  routerLink="/">Notification!</a></li>
            <li><a class="dropdown-item"  routerLink="/">Notification!</a></li>
            <li><a class="dropdown-item"  routerLink="/">Notification!</a></li>
          </ul>
        </div>
        <div class="dropdown">
          <a class="d-block text-decoration-none dropdown-toggle" id="dropdownProfile"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="#profile-icon fa-solid fa-user text-small"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="dropdownProfile">
            <li><a class="dropdown-item text-center" routerLink="/"><i id="profile-icon" class="fas fa-user-circle  text-x-large"></i></a>
            </li>
            <li><a class="dropdown-item text-center text-muted" routerLink="/">My Account</a></li>
            <li>
              <div class="border-bottom border-1  border-opacity-75"></div>
            </li>
            <li><a class="dropdown-item text-center text-muted" (click)="onClickLogout()"  routerLink="/auth">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>
