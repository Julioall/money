services:
  api:
    container_name: money-api
    build:
      context: .
      dockerfile: Application.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      RAVENDBSETTINGS_URLS: ${RAVENDBSETTINGS_URLS:-http://ravendb:8080}
      RAVENDBSETTINGS_DATABASE_NAME: ${RAVENDBSETTINGS_DATABASE_NAME:-MoneyDb}
      JWT_ISSUER: ${JWT_ISSUER:-money-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-money-clients}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-ChangeMeToStrongKey_32chars_minimum}
    ports:
      - "8080:8080"
    depends_on:
      - ravendb

  web:
    container_name: money-web
    build:
      context: .
      dockerfile: Application.Client/Dockerfile
    ports:
      - "${CLIENT_PORT:-4200}:80"
    depends_on:
      - api

  ravendb:
    container_name: ravendb
    image: ravendb/ravendb:6.0-ubuntu-latest
    environment:
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Setup_Mode: None
      RAVEN_Security_UnsecuredAccessAllowed: PublicNetwork
    ports:
      - "8081:8080"
      - "38888:38888"
    volumes:
      - ravendb-data:/opt/RavenDB/Server/RavenData

volumes:
  ravendb-data:
