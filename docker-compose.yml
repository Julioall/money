services:
  api:
    build:
      context: .
      dockerfile: Application.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      RAVENDBSETTINGS_URLS: ${RAVENDBSETTINGS_URLS:-http://ravendb:8080}
      RAVENDBSETTINGS_DATABASE_NAME: ${RAVENDBSETTINGS_DATABASE_NAME:-MoneyDb}
      JWT_ISSUER: ${JWT_ISSUER:-money-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-money-clients}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      ravendb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Application.Client/Dockerfile
    ports:
      - "${CLIENT_PORT:-4200}:80"
    depends_on:
      - api

  ravendb:
    image: ravendb/ravendb:6.2-ubuntu-latest
    environment:
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Setup_Mode: None
      RAVEN_Security_UnsecuredAccessAllowed: PublicNetwork
    ports:
      - "${RAVENDB_PORT:-8081}:8080"
      - "${RAVENDB_TCP_PORT:-38888}:38888"
    volumes:
      - ravendb-data:/var/lib/ravendb/data

volumes:
  ravendb-data:
